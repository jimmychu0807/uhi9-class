name: Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Foundry Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        id: build
        run: |
          forge --version
          forge build --sizes

      - name: Test
        id: test
        run: |
          forge test -vvv
